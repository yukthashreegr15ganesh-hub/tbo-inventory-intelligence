version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: tbo-postgres-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tbo_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tbo_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-tbo_inventory}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tbo_user} -d ${POSTGRES_DB:-tbo_inventory}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tbo-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tbo-inventory-app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      PORT: 8000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-tbo_user}:${POSTGRES_PASSWORD:-tbo_secure_pass_2026}@db:5432/${POSTGRES_DB:-tbo_inventory}
      SECRET_KEY: ${SECRET_KEY:-tbo_enterprise_jwt_secret_key_2026_production_v2}
      AUTH_REQUIRED: ${AUTH_REQUIRED:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      ACCESS_TOKEN_EXPIRE_MINUTES: 480
    volumes:
      - tbo_artifacts:/app/backend/artifacts
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - tbo-network

volumes:
  postgres_data:
    driver: local
  tbo_artifacts:
    driver: local

networks:
  tbo-network:
    driver: bridge
